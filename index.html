<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulazione prima prova Agrimanager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool: calm, encouraging, clear
   IDEA the exam booklet with its bubble answer sheet (foglio risposte a crocette)
   PICTURE the 30-bubble answer sheet, filling in as she answers, green and red once marked
   COLOUR white paper, deep field-green bands, wheat-yellow accent, brick red for errors
   TYPE Archivo 800 display + Source Sans 3 text
   LAYOUT green title band; start panel beside the answer sheet; module rows below; phone stacks title, sheet, controls */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1813);--ink:light-dark(#14231b,#e6efe8);--mute:light-dark(#53675b,#9fb3a6);
--field:light-dark(#1d4d33,#163a27);--on:#f4f8f5;--panel:light-dark(#eef4ef,#15241b);--line:light-dark(#cbd9cf,#2a3d31);
--wheat:light-dark(#e3a200,#f5c542);--ok:light-dark(#1d7a3d,#5ccb8a);--ko:light-dark(#bf341b,#ff7f61);
--okbg:light-dark(#e2f3e7,#173a25);--kobg:light-dark(#fbe7e2,#3b1f18);--wbg:light-dark(#fff4d6,#3a3115)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,"Arial Narrow",system-ui,sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,48px);font-weight:800}
h2{font-size:24px;font-weight:800}
p{margin:0}
button,select{font:inherit;font-size:16px;color:inherit}
.band{padding-block:clamp(24px,4vw,52px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
.top{background:var(--field);color:var(--on)}
.top .lead{margin-top:10px;max-width:60ch;opacity:.9}
.alt{background:var(--panel)}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:stretch}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--mute)}.small{font-size:14px}
label.f{display:grid;gap:6px;font-weight:600}
select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.btn{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 18px;background:var(--bg);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--field)}
.btn.pri{background:var(--field);color:var(--on);border-color:var(--field)}
.btn.pri:hover{filter:brightness(1.15)}
.btn.big{font-size:19px;padding:14px 22px;width:100%}
.btn:focus-visible,.opt:focus-visible,.bub:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.resume{background:var(--wbg);border-radius:10px;padding:14px;display:grid;gap:10px}
.sheet{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(6px,1.2vw,12px)}
.bub{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 clamp(12px,1.4vw,15px)/1 Archivo,system-ui,sans-serif;background:var(--bg);color:var(--mute);padding:0;cursor:default}
button.bub{cursor:pointer}
.bub.an{background:var(--field);border-color:var(--field);color:var(--on)}
.bub.fl{box-shadow:0 0 0 3px var(--wheat)}
.bub.cu{border-color:var(--ink);border-width:3px;color:var(--ink)}
.bub.an.cu{border-color:var(--wheat)}
.bub.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.bub.ko{background:var(--ko);border-color:var(--ko);color:var(--bg)}
.bub.bl{border-style:dashed;border-color:var(--ko);color:var(--ko)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.hist{display:grid;gap:6px;font-size:15px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.track{height:10px;background:var(--panel);border-radius:6px;overflow:hidden}
.track b{display:block;height:100%;background:var(--field);border-radius:6px}
.track b.lo{background:var(--ko)}.track b.mid{background:var(--wheat)}
.mods{display:grid;gap:0;margin-top:18px;border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2fr) auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mname{font-weight:700}.mname span{font-weight:400;color:var(--mute);white-space:nowrap}
.mstat{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.bar{position:sticky;top:0;z-index:5;background:var(--field);color:var(--on);padding:10px max(5vw,16px)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar .sp{flex:1}
.tm{font:800 22px/1 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm.warn{color:var(--wheat)}
.bar .btn{background:transparent;color:var(--on);border-color:rgba(255,255,255,.35)}
.bar .btn.pri{background:var(--wheat);color:#1b1a10;border-color:var(--wheat)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;max-width:1180px;margin:0 auto;align-items:start}
.qmeta{font-size:15px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px}
.qtext{font:700 clamp(21px,2.4vw,26px)/1.3 "Source Sans 3",system-ui,sans-serif;margin:10px 0 20px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;text-align:left;min-height:56px;padding:10px 16px 10px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-size:17px;line-height:1.35}
.opt:hover{border-color:var(--field)}
.opt .L{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:800 16px/1 Archivo,system-ui,sans-serif}
.opt.sel{border-color:var(--field);background:var(--panel)}
.opt.sel .L{background:var(--field);border-color:var(--field);color:var(--on)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .L{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt.bad .L{background:var(--ko);border-color:var(--ko);color:var(--bg)}
.opt[disabled]{cursor:default}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.nav .sp{flex:1}
.flagon{background:var(--wbg)!important;border-color:var(--wheat)!important}
aside.side{position:sticky;top:84px;display:grid;gap:14px}
aside .sheet,.sheet.r6{grid-template-columns:repeat(6,minmax(0,1fr))}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}
.fb strong{font-size:19px}
.dub{display:inline-block;background:var(--wbg);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.score{font:800 clamp(64px,11vw,112px)/.95 Archivo,system-ui,sans-serif;letter-spacing:-.03em}
.score small{font-size:.4em;opacity:.75}
.rhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px 48px;align-items:end}
.rfacts{display:grid;gap:6px;font-size:18px}
.rev{display:grid;gap:14px;margin-top:18px}
.ritem{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;background:var(--bg)}
.ritem .qtext{font-size:19px;margin:0}
.rops{display:grid;gap:4px;font-size:16px}
.rops div{padding:4px 10px;border-radius:8px}
.rops .c{background:var(--okbg);font-weight:600}
.rops .w{background:var(--kobg);text-decoration:line-through}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--bg);border-radius:16px;padding:24px;max-width:440px;width:100%;display:grid;gap:18px}
.foot{font-size:15px;color:var(--mute);display:grid;gap:10px}
@media(max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}aside.side{position:static}aside .sheet{grid-template-columns:repeat(10,minmax(0,1fr))}}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}.rhead{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){body{font-size:16px}.sheet,aside .sheet{grid-template-columns:repeat(6,minmax(0,1fr))}.mrow{grid-template-columns:minmax(0,1fr) auto;gap:8px 14px}.mstat{grid-column:1/-1;grid-row:2}.panel{padding:18px}.tm{font-size:20px}}
@media(prefers-reduced-motion:no-preference){.bub,.opt{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"><div class="band top"><div class="wrap"><h1>Simulazione prima prova</h1><p class="lead">Carico le domande…</p></div></div></div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><p id="mtext"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="mno">Annulla</button><button class="btn pri" id="myes">Conferma</button></div></div></div>
<script>
{
const K='agrimanager-prima-prova-v1';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let BANK=[],BY={},MODS=[];
let S={stats:{},wrong:{},hist:[],cur:null,dur:30,how:'prop'};
let filt='all',tick=null;
try{const t=JSON.parse(localStorage.getItem(K)||'null');if(t)S=Object.assign(S,t)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const day=t=>new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const pct=(a,b)=>b?Math.round(100*a/b):0;
const cls=p=>p<60?'lo':p<80?'mid':'';

const modal=document.getElementById('modal');
let onYes=null;
function ask(text,yes,label){document.getElementById('mtext').textContent=text;document.getElementById('myes').textContent=label||'Conferma';onYes=yes;modal.hidden=false;document.getElementById('mno').focus()}
document.getElementById('mno').onclick=()=>{modal.hidden=true};
document.getElementById('myes').onclick=()=>{modal.hidden=true;if(onYes)onYes()};

function pickExam(total,how){
  if(how==='rand')return shuffle(BANK.map(q=>q.n)).slice(0,total).sort((a,b)=>a-b);
  const N=BANK.length,groups=MODS.map(m=>BANK.filter(q=>q.m===m).map(q=>q.n));
  const raw=groups.map(g=>g.length*total/N),base=raw.map(Math.floor);
  const left=total-base.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-base[i]+Math.random()*1e-6,i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(x=>base[x[1]]++);
  return groups.flatMap((g,i)=>shuffle(g).slice(0,base[i])).sort((a,b)=>a-b);
}
function record(n,ok){const s=S.stats[n]||(S.stats[n]=[0,0,0]);s[0]++;s[2]=ok?1:0;if(ok){s[1]++;delete S.wrong[n]}else S.wrong[n]=(S.wrong[n]||0)+1}
function modStats(m){let seen=0,ok=0;BANK.forEach(q=>{if(q.m===m&&S.stats[q.n]){seen++;const s=S.stats[q.n];if(s[2])ok++}});return[seen,ok]}

function sheetHTML(qs,stateOf,btn){return '<div class="sheet">'+qs.map((n,i)=>{const c=stateOf(n,i);return btn?`<button class="bub ${c}" data-act="go" data-v="${i}" aria-label="Domanda ${i+1}">${i+1}</button>`:`<span class="bub ${c}">${i+1}</span>`}).join('')+'</div>'}

function home(){
  const last=S.hist[S.hist.length-1],cur=S.cur;
  const nWrong=Object.keys(S.wrong).length;
  let resume='';
  if(cur&&!cur.done){
    const what=cur.mode==='exam'?`Simulazione in corso: ${Object.keys(cur.ans).length} risposte su ${cur.qs.length}.`:`Allenamento in corso (${esc(cur.label)}): domanda ${cur.i+1} di ${cur.qs.length}.`;
    resume=`<div class="resume"><p>${what}</p><div class="row"><button class="btn pri" data-act="resume">Riprendi</button><button class="btn" data-act="cancelcur">Annulla</button></div></div>`;
  }
  const sheet=last?sheetHTML(last.qs,(n,i)=>last.ans[n]?(last.ans[n]===BY[n].a?'ok':'ko'):'bl',false):sheetHTML(Array.from({length:30},(_,i)=>i),()=>'',false);
  const cap=last?`<p><strong>${last.s}/${last.t}</strong> il ${day(last.d)} · tempo ${fmt(last.secs)}</p>`:`<p class="muted">Il foglio risposte si colora qui dopo la prima simulazione: verde le giuste, rosso le sbagliate.</p>`;
  const hist=S.hist.slice(-5).reverse().map(h=>{const p=pct(h.s,h.t);return `<div class="hrow"><span class="muted">${day(h.d)}</span><span class="track"><b class="${cls(p)}" style="width:${p}%"></b></span><strong style="white-space:nowrap">${h.s}/${h.t}</strong></div>`}).join('');
  const rows=MODS.map(m=>{const tot=BANK.filter(q=>q.m===m).length,[seen,ok]=modStats(m),p=pct(ok,seen);
    return `<div class="mrow"><div class="mname">${esc(m)} <span>· ${tot} domande</span></div><div class="mstat">${seen?`<span class="track"><b class="${cls(p)}" style="width:${p}%"></b></span><span>${ok} ${ok===1?'giusta':'giuste'} su ${seen} ${seen===1?'provata':'provate'} (${p}%)</span>`:'<span>Non ancora provato</span>'}</div><button class="btn" data-act="prac" data-v="${esc(m)}">Allenati</button></div>`}).join('');
  app.innerHTML=`
  <header class="band top"><div class="wrap"><h1>Simulazione prima prova Agrimanager</h1><p class="lead">30 domande a crocette estratte dal compendio di 288, con timer, voto finale e correzione domanda per domanda.</p></div></header>
  <section class="band"><div class="wrap grid2">
    <div class="panel">
      <h2>Simulazione d'esame</h2>
      ${resume}
      <label class="f" for="dur">Tempo a disposizione<select id="dur">${[[20,'20 minuti'],[30,'30 minuti'],[45,'45 minuti'],[60,'60 minuti'],[0,'Senza limite']].map(([v,t])=>`<option value="${v}"${+S.dur===v?' selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f" for="how">Come estrarre le domande<select id="how"><option value="prop"${S.how==='prop'?' selected':''}>In proporzione ai moduli (come un esame vero)</option><option value="rand"${S.how==='rand'?' selected':''}>Del tutto a caso</option></select></label>
      <button class="btn pri big" data-act="start">Inizia la simulazione</button>
      <p class="small muted">Risposte e voto si vedono solo alla consegna. Il tempo reale della prova lo comunica la scuola.</p>
    </div>
    <div class="panel sheetbox">
      <h2>${last?'Ultima simulazione':'Foglio risposte'}</h2>
      ${sheet}${cap}
      ${hist?`<div class="hist"><p class="small muted">Ultime simulazioni</p>${hist}</div>`:''}
    </div>
  </div></section>
  <section class="band alt"><div class="wrap">
    <h2>Allenamento per modulo</h2>
    <p class="muted" style="margin-top:8px">Qui la risposta giusta e la spiegazione compaiono subito dopo ogni domanda.</p>
    <div class="row" style="margin-top:16px"><button class="btn pri" data-act="rev"${nWrong?'':' disabled'}>Ripassa gli errori (${nWrong})</button><button class="btn" data-act="prac" data-v="*">Tutto il compendio a caso</button></div>
    <div class="mods">${rows}</div>
  </div></section>
  <footer class="band"><div class="wrap foot">
    <p>Le domande sono quelle del compendio ufficiale. La chiave di correzione non è della scuola: 11 risposte, segnate «da verificare», vanno confermate col docente.</p>
    <p>I progressi restano salvati solo su questo dispositivo e su questo browser.</p>
    <div><button class="btn" data-act="reset">Azzera i progressi</button></div>
  </div></footer>`;
}

function optsHTML(q,chosen,reveal){return '<div class="opts">'+Object.entries(q.o).map(([L,t])=>{let c='';if(reveal){if(L===q.a)c='good';else if(L===chosen)c='bad'}else if(L===chosen)c='sel';return `<button class="opt ${c}" data-act="ans" data-v="${L}"${reveal?' disabled':''}><span class="L">${L}</span><span>${esc(t)}</span></button>`}).join('')+'</div>'}

function exam(){
  const c=S.cur,n=c.qs[c.i],q=BY[n],answered=Object.keys(c.ans).length,flags=Object.keys(c.flag).length;
  app.innerHTML=`
  <div class="bar"><div class="bar-in"><span class="tm" id="tm">--:--</span><span>Domanda ${c.i+1} di ${c.qs.length}</span><span class="sp"></span><button class="btn" data-act="quit">Esci</button><button class="btn pri" data-act="hand">Consegna</button></div></div>
  <div class="band"><div class="exam">
    <section>
      <div class="qmeta"><span>${esc(q.m)}</span><span>n. ${q.n} del compendio</span></div>
      <p class="qtext">${esc(q.q)}</p>
      ${n===194?'<p class="small muted" style="margin:-10px 0 14px">L\'immagine non è presente nel compendio.</p>':''}
      ${optsHTML(q,c.ans[n],false)}
      <div class="nav"><button class="btn" data-act="prev"${c.i?'':' disabled'}>‹ Indietro</button><button class="btn ${c.flag[n]?'flagon':''}" data-act="flag">${c.flag[n]?'Segnata per dopo':'Segna per dopo'}</button><span class="sp"></span>${c.i<c.qs.length-1?'<button class="btn pri" data-act="next">Avanti ›</button>':'<button class="btn pri" data-act="hand">Consegna</button>'}</div>
    </section>
    <aside class="side">
      <h2 style="font-size:20px">Foglio risposte</h2>
      ${sheetHTML(c.qs,(m,i)=>[c.ans[m]?'an':'',c.flag[m]?'fl':'',i===c.i?'cu':''].join(' '),true)}
      <div class="legend"><span>${answered} risposte su ${c.qs.length}</span>${flags?`<span><i style="box-shadow:0 0 0 3px var(--wheat)"></i>${flags} da rivedere</span>`:''}</div>
    </aside>
  </div></div>`;
  const tm=document.getElementById('tm');
  const upd=()=>{const el=(Date.now()-c.t0)/1000;if(c.dur){const rem=c.dur*60-el;tm.textContent=fmt(rem);tm.classList.toggle('warn',rem<=120);if(rem<=0)finishExam(true)}else tm.textContent=fmt(el)};
  upd();tick=setInterval(upd,1000);
}

function finishExam(auto){
  const c=S.cur;if(c.done)return;clearInterval(tick);
  c.done=true;c.auto=!!auto;c.secs=Math.min((Date.now()-c.t0)/1000,c.dur?c.dur*60:Infinity);
  let s=0;c.qs.forEach(n=>{const ok=c.ans[n]===BY[n].a;if(ok)s++;record(n,ok)});
  c.s=s;S.hist.push({d:Date.now(),s,t:c.qs.length,secs:c.secs,qs:c.qs,ans:c.ans});S.hist=S.hist.slice(-20);
  filt='all';save();render();window.scrollTo(0,0);
}

function results(){
  const c=S.cur,t=c.qs.length,p=pct(c.s,t);
  const by={};c.qs.forEach(n=>{const m=BY[n].m;by[m]=by[m]||[0,0];by[m][0]++;if(c.ans[n]===BY[n].a)by[m][1]++});
  const ms=Object.entries(by).sort((a,b)=>a[1][1]/a[1][0]-b[1][1]/b[1][0]);
  const weak=ms.filter(([m,v])=>v[1]<v[0]).slice(0,2).map(x=>x[0]);
  const blank=c.qs.filter(n=>!c.ans[n]).length;
  const list=c.qs.map((n,i)=>[n,i]).filter(([n])=>filt==='all'||c.ans[n]!==BY[n].a).map(([n,i])=>{const q=BY[n],ch=c.ans[n],ok=ch===q.a;
    return `<article class="ritem"><div class="qmeta"><strong style="color:var(${ok?'--ok':'--ko'})">${i+1}. ${ok?'Giusta':ch?'Sbagliata':'Senza risposta'}</strong><span>${esc(q.m)}</span><span>n. ${q.n}</span>${q.d?'<span class="dub">da verificare</span>':''}</div>
    <p class="qtext">${esc(q.q)}</p><div class="rops">${Object.entries(q.o).map(([L,tx])=>`<div class="${L===q.a?'c':L===ch?'w':''}">${L}) ${esc(tx)}${L===q.a?' ✓':''}</div>`).join('')}</div><p class="muted">${esc(q.e)}</p></article>`}).join('');
  app.innerHTML=`
  <header class="band top"><div class="wrap rhead">
    <div class="score">${c.s}<small> / ${t}</small></div>
    <div class="rfacts"><h1 style="font-size:clamp(28px,4vw,40px)">${p}% di risposte giuste</h1><p>Tempo usato ${fmt(c.secs)}${c.auto?' (tempo scaduto)':''}${blank?` · ${blank} senza risposta`:''}</p>${weak.length?`<p>Da ripassare: ${weak.map(esc).join(' e ')}</p>`:'<p>Nessun errore: ottimo lavoro.</p>'}</div>
  </div></header>
  <section class="band"><div class="wrap grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">
    <div class="panel sheetbox"><h2>Foglio corretto</h2>${sheetHTML(c.qs,n=>c.ans[n]?(c.ans[n]===BY[n].a?'ok':'ko'):'bl',false).replace('class="sheet"','class="sheet r6"')}
      <div class="legend"><span><i style="background:var(--ok)"></i>giusta</span><span><i style="background:var(--ko)"></i>sbagliata</span><span><i style="border:2px dashed var(--ko)"></i>vuota</span></div></div>
    <div class="panel"><h2>Per modulo</h2><div class="hist">${ms.map(([m,v])=>{const q=pct(v[1],v[0]);return `<div class="hrow" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto"><span>${esc(m)}</span><span class="track"><b class="${cls(q)}" style="width:${q}%"></b></span><strong style="white-space:nowrap">${v[1]}/${v[0]}</strong></div>`}).join('')}</div>
      <div class="row"><button class="btn pri" data-act="start">Nuova simulazione</button>${c.s<t?'<button class="btn" data-act="redo">Rifai gli errori</button>':''}<button class="btn" data-act="home">Torna all\'inizio</button></div></div>
  </div></section>
  <section class="band alt"><div class="wrap">
    <div class="row" style="justify-content:space-between"><h2>Correzione</h2><div class="row"><button class="btn ${filt==='all'?'pri':''}" data-act="filt" data-v="all">Tutte</button><button class="btn ${filt==='ko'?'pri':''}" data-act="filt" data-v="ko">Solo errori</button></div></div>
    <div class="rev">${list||'<p class="muted">Nessun errore da mostrare.</p>'}</div>
  </div></section>`;
}

function practice(){
  const c=S.cur,n=c.qs[c.i],q=BY[n],ch=c.ans[n],shown=!!ch,ok=ch===q.a;
  const done=Object.keys(c.ans).length,good=Object.entries(c.ans).filter(([m,a])=>BY[m].a===a).length;
  app.innerHTML=`
  <div class="bar"><div class="bar-in"><strong>${esc(c.label)}</strong><span>Domanda ${c.i+1} di ${c.qs.length}</span><span class="sp"></span><span style="white-space:nowrap">${good} ${good===1?'giusta':'giuste'} su ${done}</span><button class="btn" data-act="pend">Termina</button></div></div>
  <div class="band"><div class="wrap" style="max-width:820px">
    <div class="qmeta"><span>${esc(q.m)}</span><span>n. ${q.n} del compendio</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${n===194?'<p class="small muted" style="margin:-10px 0 14px">L\'immagine non è presente nel compendio.</p>':''}
    ${optsHTML(q,ch,shown)}
    ${shown?`<div class="fb ${ok?'ok':'ko'}"><strong>${ok?'Esatto!':'Non è questa: la risposta giusta è la '+q.a+'.'}</strong><p>${esc(q.e)}</p>${q.d?'<p><span class="dub">Risposta da verificare col docente</span></p>':''}</div>
    <div class="nav"><span class="sp"></span><button class="btn pri" data-act="pnext" id="pnext">${c.i<c.qs.length-1?'Prossima ›':'Vedi il risultato'}</button></div>`:'<p class="small muted" style="margin-top:14px">Tocca una risposta (o premi A, B, C, D sulla tastiera).</p>'}
  </div></div>`;
  if(shown){const b=document.getElementById('pnext');if(b)b.focus({preventScroll:true})}
}

function pracEnd(){
  const c=S.cur,done=Object.keys(c.ans).length,good=Object.entries(c.ans).filter(([m,a])=>BY[m].a===a).length,bad=Object.keys(c.ans).filter(m=>BY[m].a!==c.ans[m]);
  app.innerHTML=`
  <header class="band top"><div class="wrap rhead"><div class="score">${good}<small> / ${done}</small></div>
  <div class="rfacts"><h1 style="font-size:clamp(28px,4vw,40px)">${esc(c.label)}</h1><p>${done?pct(good,done)+'% di risposte giuste':'Nessuna risposta data'}${bad.length?` · ${bad.length} da ripassare`:''}</p></div></div></header>
  <section class="band"><div class="wrap row">${bad.length?'<button class="btn pri" data-act="redo">Rifai gli sbagliati</button>':''}<button class="btn" data-act="home">Torna all\'inizio</button></div></section>`;
}

function startPractice(qs,label){if(!qs.length)return;S.cur={mode:'prac',qs,i:0,ans:{},label,done:false};save();render();window.scrollTo(0,0)}
function startExam(){
  const d=document.getElementById('dur'),h=document.getElementById('how');
  if(d)S.dur=+d.value;if(h)S.how=h.value;
  S.cur={mode:'exam',qs:pickExam(30,S.how),i:0,ans:{},flag:{},t0:Date.now(),dur:+S.dur,done:false};save();render();window.scrollTo(0,0);
}
function render(){clearInterval(tick);const c=S.cur;if(!c)return home();if(c.mode==='exam')return c.done?results():exam();return c.done?pracEnd():practice()}
function goTo(i){const c=S.cur;c.i=Math.max(0,Math.min(c.qs.length-1,i));save();render()}
function answer(L){
  const c=S.cur;if(!c||c.done)return;const n=c.qs[c.i];
  if(c.mode==='exam'){if(!(L in BY[n].o))return;c.ans[n]=L;save();render();return}
  if(c.ans[n]||!(L in BY[n].o))return;c.ans[n]=L;record(n,L===BY[n].a);save();render();
}
function pnext(){const c=S.cur;if(c.i<c.qs.length-1){c.i++;save();render();window.scrollTo(0,0)}else{c.done=true;save();render()}}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const v=b.dataset.v,c=S.cur;
  switch(b.dataset.act){
    case'start':if(c&&!c.done&&c.mode==='exam')return ask('C\'è già una simulazione in corso. Vuoi annullarla e iniziarne una nuova?',startExam,'Nuova simulazione');return startExam();
    case'resume':return render();
    case'cancelcur':return ask('Annullo quello che è in corso? Le risposte date finora non verranno contate.',()=>{S.cur=null;save();render()},'Annulla');
    case'prac':return startPractice(v==='*'?shuffle(BANK.map(q=>q.n)):shuffle(BANK.filter(q=>q.m===v).map(q=>q.n)),v==='*'?'Tutto il compendio':v);
    case'rev':return startPractice(shuffle(Object.keys(S.wrong).map(Number).filter(n=>BY[n])),'Ripasso errori');
    case'redo':return startPractice(shuffle(c.qs.filter(n=>c.ans[n]!==BY[n].a)),'Rifai gli errori');
    case'ans':return answer(v);
    case'go':return goTo(+v);
    case'prev':return goTo(c.i-1);
    case'next':return goTo(c.i+1);
    case'flag':{const n=c.qs[c.i];if(c.flag[n])delete c.flag[n];else c.flag[n]=1;save();return render()}
    case'hand':{const miss=c.qs.length-Object.keys(c.ans).length;return ask(miss?`Ci sono ancora ${miss} domande senza risposta. Consegni lo stesso?`:'Consegni la prova? Dopo non potrai più cambiare le risposte.',()=>finishExam(false),'Consegna')}
    case'quit':clearInterval(tick);return home();
    case'pnext':return pnext();
    case'pend':c.done=true;save();return render();
    case'filt':filt=v;return render();
    case'home':S.cur=null;save();return home();
    case'reset':return ask('Cancello storico, statistiche ed errori salvati su questo dispositivo?',()=>{S={stats:{},wrong:{},hist:[],cur:null,dur:S.dur,how:S.how};save();render()},'Azzera');
  }
});
app.addEventListener('change',e=>{if(e.target.id==='dur'){S.dur=+e.target.value;save()}if(e.target.id==='how'){S.how=e.target.value;save()}});
document.addEventListener('keydown',e=>{
  if(!modal.hidden){if(e.key==='Escape')modal.hidden=true;return}
  const c=S.cur;if(!c||c.done||e.ctrlKey||e.metaKey||e.altKey||document.activeElement?.tagName==='SELECT')return;
  if(!document.querySelector('.opts'))return;
  const k=e.key.toUpperCase(),map={'1':'A','2':'B','3':'C','4':'D','5':'E'};
  if('ABCDE'.includes(k)&&k.length===1){answer(k);return}
  if(map[k]){answer(map[k]);return}
  if(c.mode==='exam'){if(e.key==='ArrowRight')goTo(c.i+1);if(e.key==='ArrowLeft')goTo(c.i-1)}
  else if(e.key==='Enter'&&c.ans[c.qs[c.i]]&&document.activeElement?.id!=='pnext'){e.preventDefault();pnext()}
});

function boot(d){
  if(d&&d.S)S=d.S;
  fetch('bank.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
    BANK=data;BANK.forEach(q=>{BY[q.n]=q;if(!MODS.includes(q.m))MODS.push(q.m)});
    if(S.cur&&S.cur.qs.some(n=>!BY[n]))S.cur=null;
    render();
  }).catch(()=>{app.innerHTML='<div class="band top"><div class="wrap"><h1>Simulazione prima prova</h1><p class="lead">Non riesco a caricare le domande. Ricarica la pagina tra qualche secondo.</p></div></div>'});
}
window.claude?.hot?.snapshot?.(()=>({S}));
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
